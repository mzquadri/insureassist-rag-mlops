# Phase 6 — CI/CD with GitHub Actions.
# On every push to main: build the Docker image, push it to Artifact Registry, and
# roll it out to GKE. This is "continuous deployment".
#
# Before it works you must add these repo secrets (GitHub -> Settings -> Secrets -> Actions):
#   GCP_PROJECT           your GCP project id
#   GCP_SA_KEY            a service-account JSON key with GKE + Artifact Registry access
#   GKE_CLUSTER           insureassist-cluster
#   GKE_LOCATION          europe-west3
#
# Until then, this file simply documents the pipeline (it won't run without the secrets).

name: build-and-deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # lets you run it manually from the Actions tab

env:
  REGION: europe-west3
  REPO: insureassist
  IMAGE: api

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMG=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.REPO }}/${{ env.IMAGE }}:${{ github.sha }}
          docker build -t $IMG .
          docker push $IMG
          echo "IMG=$IMG" >> $GITHUB_ENV

      - name: Deploy to GKE
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER }} --location ${{ secrets.GKE_LOCATION }}
          kubectl set image deployment/insureassist-api api=$IMG
          kubectl rollout status deployment/insureassist-api
