# CI: three jobs, each producing real evidence.
#
# The old workflow ran compileall and ruff and called that green. It never installed the
# dependencies, never imported the application, never started a database and never made an
# HTTP request. What follows is what a green tick now actually means.
#
# What it still does NOT do: run a language model. No generator is available in CI, so
# generation quality is not measured here. The container job proves the request reaches the
# generator and fails there - which is what can be honestly verified without shipping a
# 2 GB model into every Actions run.

name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: lint, types, offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check src eval tests scripts --output-format=github

      - name: Compile
        run: python -m compileall -q src eval tests scripts

      - name: Corpus checksums
        run: python -m scripts.fetch_nfip_corpus --check

      - name: Ground-truth validation
        run: python -m eval.validate_ground_truth

      - name: Documentation matches the reference run
        run: python -m eval.verify_artifacts

      - name: Offline test suite
        # No services are started on purpose. The suite must pass with no vector database,
        # no generator and no network; if it ever needs one, the provider seam has
        # regressed and this step is where that surfaces.
        run: pytest

  retrieval-eval:
    name: retrieval reference run
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ingest the committed corpus
        env:
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: nfip_sfip
        run: python -m src.ingest

      - name: Re-ingest to prove idempotency
        env:
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: nfip_sfip
        run: |
          python -m src.ingest | tee second-run.txt
          grep -q "Collection now holds 314 points" second-run.txt

      - name: Reproduce the held-out reference run
        env:
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: nfip_sfip
        run: python -m eval.reference_run --split test --out /tmp/ci_reference_run.json

      - name: Committed metrics must still reproduce
        # Retrieval is deterministic, so a drift here means the corpus, the labels, the
        # chunking or the retriever changed without the artefact being regenerated.
        run: python -m eval.compare_runs eval/reference_run.json /tmp/ci_reference_run.json

  container-integration:
    name: docker build and live HTTP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the image
        run: docker build -t insureassist:test .

      - name: Assert the container does not run as root
        run: |
          uid=$(docker run --rm insureassist:test id -u)
          test "$uid" = "10001" || { echo "container runs as uid $uid"; exit 1; }

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Container integration tests
        env:
          INSUREASSIST_INTEGRATION: "1"
          INSUREASSIST_IMAGE: insureassist:test
        run: pytest tests/test_docker_integration.py -v

  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate YAML parses
        # Parsing only. This says nothing about whether the manifests deploy or work; they
        # have never been applied to a cluster and the README says so.
        run: |
          pip install pyyaml
          python -c "import yaml,glob; [list(yaml.safe_load_all(open(f))) for f in glob.glob('k8s/*.yaml')]; print('k8s YAML OK')"
      - name: Manifest invariants
        run: python -m scripts.check_manifests
