# Phase 1: run Qdrant (the vector database) locally, FULLY ISOLATED from any other stack.
#
# This project is standalone and personal. To make sure it never clashes with another
# Docker stack on your machine (e.g. a work stack that also runs Qdrant on 6333):
#   - a dedicated compose project name ("insureassist") prefixes its network/volume
#   - a unique container name
#   - host ports 6533/6534 (NOT the default 6333/6334)
#
# Start it:   docker compose up -d qdrant
# Stop it:    docker compose down          (add -v to also delete its data volume)

name: insureassist

services:
  qdrant:
    # Pinned, and pinned to the same tag CI uses. Everything else in this project is
    # version-locked so a run today and a run next month agree; an unpinned vector
    # database undoes that, because the retrieval numbers depend on its behaviour.
    image: qdrant/qdrant:v1.19.0
    container_name: insureassist-qdrant
    ports:
      - "6533:6333"   # host 6533 -> container 6333 (REST). Avoids clashing with :6333
      - "6534:6334"   # host 6534 -> container 6334 (gRPC)
    volumes:
      - qdrant_storage:/qdrant/storage

  # The API is deliberately not a service here. It is built and exercised by CI
  # (container-integration builds the image, asserts it runs non-root and drives live
  # HTTP against it), and running it locally needs an embedding model download plus
  # Ollama, neither of which belongs in "bring up the vector database". To run the API
  # against this Qdrant:
  #
  #   docker build -t insureassist:local .
  #   docker run --rm -p 8000:8000 --network insureassist_default   #     -e QDRANT_URL=http://insureassist-qdrant:6333 insureassist:local

volumes:
  qdrant_storage:      # becomes "insureassist_qdrant_storage" — isolated from other stacks
