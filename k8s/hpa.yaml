# HorizontalPodAutoscaler = automatic scaling.
# It watches CPU usage and adds/removes API pods between 2 and 6 to handle traffic.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: insureassist-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: insureassist-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # scale up when average CPU > 70%
