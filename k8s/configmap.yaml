# Non-secret configuration injected into the API pods as environment variables.
# In-cluster service names (qdrant, ollama) resolve via Kubernetes DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: insureassist-config
data:
  QDRANT_URL: "http://qdrant:6333"
  QDRANT_COLLECTION: "insurance_docs"
  EMBEDDING_MODEL: "BAAI/bge-small-en-v1.5"
  LLM_BACKEND: "ollama"
  OLLAMA_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.2:3b"
  TOP_K: "4"
