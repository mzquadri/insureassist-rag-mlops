# Qdrant vector database running inside the cluster.
# A Deployment manages the pod; a Service gives it a stable in-cluster address ("qdrant").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: qdrant/qdrant:latest
          ports:
            - containerPort: 6333
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1",    memory: "1Gi" }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant          # other pods reach it at http://qdrant:6333
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
