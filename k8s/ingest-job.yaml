# One-off Job that loads the documents into Qdrant (documents -> embeddings -> vectors).
# Uses the same application image (it contains src/ and data/).
# Set the image to your Artifact Registry image before applying.
apiVersion: batch/v1
kind: Job
metadata:
  name: ingest
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: ingest
          image: insureassist:v0.2.0      # replace with your pushed image
          command: ["python", "-m", "src.ingest"]
          envFrom:
            - configMapRef:
                name: insureassist-config
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "2",    memory: "3Gi" }
