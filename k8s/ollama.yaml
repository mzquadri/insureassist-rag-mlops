# Ollama runs the LLM inside the cluster (CPU inference — fine for a demo).
# After it starts, pull the model once:
#   kubectl exec deploy/ollama -- ollama pull llama3.2:3b
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests: { cpu: "1", memory: "3Gi" }
            limits:   { cpu: "2", memory: "6Gi" }
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama          # reachable in-cluster at http://ollama:11434
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
